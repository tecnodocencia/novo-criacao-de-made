<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Código Secreto Animado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: palco 16:9 (1280×720 escalado) + controles + narração sincronizada. Visual único do MADE (sem tema escuro, como o sistema). */
:root{
  --pink:#FCB6C0; --rose:#EA3257; --rose-dk:#D12A4C; --ink:#4c0519; --wine:#6b0f1a;
  --paper:#ffffff; --muted:#7a4a55; --line:#f1c9d0;
  --amber:#F9C77A; --amber-bg:#FDE2B5; --green:#22c55e; --green-bg:#CFF3DC; --green-dk:#15803d;
  --sky:#7CCBEF; --sky-bg:#D3EEFB; --pinkish:#FCB6D4; --pinkish-bg:#FDD9E8; --red:#f87171; --red-dk:#b91c1c;
  --yellow:#facc15; --slate:#e2e8f0;
  --display:"Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
html,body{background:var(--pink);color:var(--ink)}
body{font-family:var(--display)}
*{box-sizing:border-box}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-block:28px 48px;padding-inline:16px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:18px;padding:8px;box-shadow:0 8px 20px rgba(234,50,87,.18)}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#be123c}
h1{margin:2px 0 0;font-size:clamp(22px,4vw,32px);font-weight:900;line-height:1.1;text-wrap:balance}

/* player */
.player{background:#fff;border-radius:28px;padding:10px;box-shadow:0 18px 40px rgba(190,18,60,.18)}
.screen{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:20px;overflow:hidden;background:var(--amber-bg)}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;transition:background-color .8s ease}
.controls{display:flex;align-items:center;gap:8px;padding:10px 6px 4px;flex-wrap:wrap}
.btn{font:inherit;font-weight:900;font-size:13px;border:0;border-radius:14px;padding:10px 14px;cursor:pointer;background:#fdecef;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#fbd5dc}
.btn:focus-visible,.chap:focus-visible,select:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.btn.primary{background:var(--rose);color:#fff;min-width:108px;justify-content:center}
.btn.primary:hover{background:var(--rose-dk)}
.btn[aria-pressed="false"]{opacity:.55}
.seek{flex:1 1 220px;height:14px;border-radius:999px;background:#fdecef;cursor:pointer;position:relative;overflow:hidden;min-width:0}
.seek i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#F9C77A,#7FDDA0,#7CCBEF,#FCB6D4,#EA3257);background-size:var(--w,1000px) 100%}
.time{font-size:12px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.chapters{flex:1 1 260px;display:flex;gap:4px;min-width:0}
.chap{flex:1;height:30px;border:0;border-radius:10px;background:#fdecef;cursor:pointer;position:relative;overflow:hidden;padding:0}
.chap span{position:relative;z-index:1;font:inherit;font-size:11px;font-weight:900;color:var(--ink)}
.chap i{position:absolute;inset:0 auto 0 0;width:0;background:var(--c,#EA3257);opacity:.9}
.voice{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
select{font:inherit;font-size:12px;font-weight:800;border-radius:12px;border:2px solid var(--line);padding:7px 8px;max-width:210px;background:#fff;color:var(--ink)}
.note{font-size:12.5px;color:var(--muted);font-weight:600;padding:2px 8px 6px;max-width:75ch}

/* narração */
.script{background:#fff;border-radius:28px;padding:22px;box-shadow:0 12px 30px rgba(190,18,60,.14)}
.script h2{margin:0 0 12px;font-size:18px;font-weight:900}
.script ol{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.script li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;cursor:pointer;border-radius:16px;padding:10px 12px;transition:background .3s}
.script li:hover{background:#fff4f6}
.script li b{font-size:11px;font-weight:900;border-radius:999px;padding:4px 10px;white-space:nowrap;background:var(--c);color:var(--ink)}
.script li p{margin:0;font-size:14.5px;line-height:1.55;font-weight:600;min-width:0;color:#5b2a35}
.script .s.on{background:#fde047;color:var(--ink);border-radius:4px;box-shadow:0 0 0 2px #fde047}

/* ---------- elementos do palco ---------- */
.tag{position:absolute;left:56px;top:40px;font-size:15px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;background:#fff;border-radius:999px;padding:8px 18px;color:var(--ink);box-shadow:0 6px 16px rgba(76,5,25,.08)}
.head{position:absolute;left:56px;top:92px;font-size:52px;font-weight:900;line-height:1.02;color:var(--ink);max-width:640px;text-wrap:balance;letter-spacing:-.01em}
.sub{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);max-width:1100px;width:max-content;background:rgba(76,5,25,.9);color:#fff;font-size:25px;font-weight:800;line-height:1.3;padding:12px 24px;border-radius:18px;text-align:center;z-index:50;transition:opacity .25s}
.sub:empty{opacity:0}
.card{position:absolute;width:112px;height:142px;border-radius:18px;background:#fff;border:4px solid var(--wine);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:19px;color:var(--wine);padding:6px;line-height:1.1;box-shadow:0 8px 0 rgba(107,15,26,.18);transition:background-color .5s,border-color .5s,color .5s}
.card.back{background:var(--wine);color:#fff;font-size:54px}
.card.ok{background:#dcfce7;border-color:var(--green-dk);color:var(--green-dk)}
.card.no{background:#fee2e2;border-color:var(--red-dk);color:var(--red-dk)}
.card.sm{width:84px;height:104px;font-size:15px;border-radius:14px;border-width:3px}
.card.xs{width:62px;height:78px;font-size:12px;border-radius:11px;border-width:3px;box-shadow:0 5px 0 rgba(107,15,26,.15)}
.card.gone{opacity:.35}
.x{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);pointer-events:none}
.card.back{font-size:54px}.card.back.sm{font-size:44px}.card.back.xs{font-size:32px}
.pill{position:absolute;font-weight:900;font-size:20px;border-radius:999px;padding:10px 20px;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.dot{width:30px;height:30px;border-radius:50%;border:3px solid transparent;display:inline-block;flex-shrink:0}
.dot.g{background:var(--green);border-color:#16a34a}.dot.y{background:var(--yellow);border-color:#eab308}.dot.w{background:#fff;border-color:#cbd5e1}
.fb{position:absolute;display:grid;grid-template-columns:repeat(2,30px);gap:8px;background:#fff;border-radius:16px;padding:10px;box-shadow:0 6px 14px rgba(76,5,25,.08)}
.panel{position:absolute;background:#fff;border-radius:28px;box-shadow:0 14px 30px rgba(76,5,25,.10)}
.lbl{position:absolute;font-size:15px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big{position:absolute;font-weight:900;color:var(--ink);line-height:1}
.legend{position:absolute;display:flex;align-items:center;gap:14px;font-size:22px;font-weight:800;background:#fff;border-radius:20px;padding:14px 20px;width:360px;color:var(--ink);box-shadow:0 6px 14px rgba(76,5,25,.07);transition:transform .4s,box-shadow .4s}
.legend.hi{transform:scale(1.08);box-shadow:0 0 0 5px var(--rose),0 12px 26px rgba(76,5,25,.18)}
.bar{position:absolute;bottom:0;width:96px;border-radius:18px 18px 8px 8px}
.pip{width:22px;height:22px;border-radius:50%;background:var(--rose);display:inline-block;transition:transform .35s, opacity .35s}
.pip.off{transform:scale(.3);opacity:.15}
.row{position:absolute;display:flex;gap:10px;align-items:center}
.note-paper{position:absolute;background:#fffbe6;border:3px dashed #d4a017;border-radius:16px;padding:16px 20px;font-size:20px;font-weight:800;color:#6b4e00;width:440px;line-height:1.35}
@media (prefers-reduced-motion: reduce){ .card,.legend,.pip{transition:none} }

/* capa */
.cover{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:var(--amber-bg)}
.cover-inner{display:flex;align-items:center;gap:36px;padding:24px}
.cover img{width:clamp(90px,22%,230px);transform:rotate(-6deg);filter:drop-shadow(0 12px 18px rgba(107,15,26,.25))}
.cover h2{margin:0;font-size:clamp(20px,4.4vw,48px);font-weight:900;line-height:1.02;color:var(--ink)}
.cover p{margin:6px 0 16px;font-size:clamp(11px,1.6vw,17px);font-weight:700;color:var(--muted)}
.cover .btn.primary{font-size:clamp(13px,1.8vw,18px);padding:12px 22px;border-radius:18px}
.end{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(252,182,192,.78)}
@media (max-width:560px){ .cover-inner{gap:14px;padding:12px} .voice{width:100%} select{max-width:none;flex:1} }
</style>

const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage'), screen = document.getElementById('screen');

/* ---------- escala do palco ---------- */
function fit(){ const s = screen.clientWidth/1280; stage.style.transform = `scale(${s})`; }
new ResizeObserver(fit).observe(screen); fit();

/* ---------- relógio pausável ---------- */
let playing=false, clock=0, last=performance.now(), timers=[];
function later(fn, ms){ timers.push({at:clock+ms, fn}); }
function tick(now){
  const dt = now-last; last=now;
  if(playing){ clock+=dt; const due=timers.filter(t=>t.at<=clock); timers=timers.filter(t=>t.at>clock); due.forEach(t=>t.fn()); }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- helpers ---------- */
const $ = (html) => { const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; };
function put(node, x, y){ node.style.left=x+'px'; node.style.top=y+'px'; stage.appendChild(node); return node; }
function A(node, frames, o={}){
  const a = node.animate(frames, Object.assign({duration:600, easing:'cubic-bezier(.2,.8,.2,1)', fill:'both'}, o, RM?{duration:1,delay:0}:{}));
  if(!playing) a.pause(); return a;
}
const pop = (n,d=0)=>A(n,[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1.08)',offset:.7},{opacity:1,transform:'scale(1)'}],{duration:520,delay:d});
const rise = (n,d=0)=>A(n,[{opacity:0,transform:'translateY(40px)'},{opacity:1,transform:'none'}],{duration:620,delay:d});
const fadeOut = (n,d=0)=>A(n,[{opacity:1},{opacity:0}],{duration:400,delay:d});
function card(txt, cls=''){ return $(`<div class="card ${cls}">${txt}</div>`); }
function flip(n, txt, cls, d=0){
  A(n,[{transform:'rotateY(0)'},{transform:'rotateY(90deg)'}],{duration:220,delay:d,easing:'ease-in',fill:'none'});
  later(()=>{ n.className='card '+cls; n.textContent=txt; A(n,[{transform:'rotateY(90deg)'},{transform:'rotateY(0)'}],{duration:240,easing:'ease-out',fill:'none'}); }, d+220);
}
function moveTo(n, x, y, dur=700, d=0){
  const ox=parseFloat(n.style.left), oy=parseFloat(n.style.top);
  const mv=A(n,[{transform:'translate(0,0)'},{transform:`translate(${x-ox}px,${y-oy}px)`}],{duration:dur,delay:d,fill:'forwards',easing:'cubic-bezier(.5,0,.2,1)'});
  later(()=>{ mv.cancel(); n.style.left=x+'px'; n.style.top=y+'px'; }, d+dur+(RM?0:5));
}

function buildScene(i){
  stage.getAnimations({subtree:true}).forEach(a=>a.cancel());
  stage.innerHTML=''; timers=timers.filter(t=>t.keep); for(const k in S) delete S[k];
  stage.style.backgroundColor = SCENES[i].bg; screen.style.background = SCENES[i].bg;
  stage.appendChild($(`<div class="sub"></div>`)); sub().hidden=!subsOn;
  si=i; SCENES[i].build();
  A(stage,[{opacity:0},{opacity:1}],{duration:350,fill:'none'});
}
function fire(ev){
  const [, s, b] = ev;
  if(s!==si) buildScene(s);
  bi=b; SCENES[s].beats[b][1](); const el=sub(); if(el) el.textContent=SCENES[s].beats[b][0]; hl();
}
function driver(){
  if(playing && !ended){
    const t=now(), tl=TL[mode].tl;
    while(next<tl.length && tl[next][0] <= t+0.05){ fire(tl[next]); next++; }
    if(!audioOk && t>=TL[mode].len){ ended=true; later(finish,1200); }
  }
  const p=Math.min(1, now()/TL[mode].len);
  fill.style.width=(p*100)+'%'; seek.setAttribute('aria-valuenow',Math.round(p*100));
  timeEl.textContent=`${fmt(now())} / ${fmt(TL[mode].len)}`;
  requestAnimationFrame(driver);
}
const fmt = t => `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
const seek=document.getElementById('seek'), fill=document.getElementById('seekFill'), timeEl=document.getElementById('time');
new ResizeObserver(()=>fill.style.setProperty('--w',seek.clientWidth+'px')).observe(seek);

function finish(){ pause(); document.getElementById('endScreen').hidden=false; }
function play(){
  if(playing) return;
  document.getElementById('cover').hidden=true; document.getElementById('endScreen').hidden=true;
  if(ended){ seekTo(0); }
  playing=true; stage.getAnimations({subtree:true}).forEach(a=>a.play()); setBtn();
  audio.muted=!voiceOn;
  if(audioOk){ const pr=audio.play(); if(pr) pr.catch(()=>{ audioOk=false; vt0=clock-audio.currentTime*1000; }); }
}
function pause(){
  if(!playing) return; playing=false; audio.pause();
  stage.getAnimations({subtree:true}).forEach(a=>a.pause()); setBtn();
}
// pular: volta ao começo do trecho visual em que o tempo cai
function seekTo(t){
  const tl=TL[mode].tl; let k=0;
  for(let i=0;i<tl.length;i++) if(tl[i][0]<=t) k=i;
  const s=tl[k][1]; let first=tl.findIndex(x=>x[1]===s);
  if(t < tl[0][0]) first=0;
  const start = first===0 ? 0 : tl[first][0]-0.05;
  ended=false; next=first; si=-1; bi=-1;
  stage.getAnimations({subtree:true}).forEach(a=>a.cancel()); stage.innerHTML=''; timers=[];
  try{ audio.currentTime=start; }catch(e){}
  vt0=clock-start*1000;
  document.getElementById('endScreen').hidden=true; document.getElementById('cover').hidden=true;
  if(!playing) play();
}
function setBtn(){ document.getElementById('playBtn').textContent = playing ? '❚❚ Pausar' : '▶ Play'; }
requestAnimationFrame(driver);

seek.addEventListener('click',e=>{ const r=seek.getBoundingClientRect(); seekTo(TL[mode].len*(e.clientX-r.left)/r.width); });
seek.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); const tl=TL[mode].tl, t=now();
  const starts=[...new Set(tl.map(x=>x[1]))].map(s=>tl.find(x=>x[1]===s)[0]);
  const target = e.key==='ArrowRight' ? starts.find(x=>x>t+0.5) : [...starts].reverse().find(x=>x<t-1.5);
  seekTo(target ?? (e.key==='ArrowRight'?TL[mode].len-0.1:0)); } });
document.getElementById('startBtn').onclick = ()=>play();
document.getElementById('replayBtn').onclick = ()=>seekTo(0);
document.getElementById('playBtn').onclick = ()=> playing ? pause() : play();
const vt=document.getElementById('voiceToggle');
vt.onclick = ()=>{ voiceOn=!voiceOn; vt.setAttribute('aria-pressed',String(voiceOn)); vt.textContent = voiceOn?'🔊 Voz':'🔇 Voz'; audio.muted=!voiceOn; };
const st=document.getElementById('subToggle');
st.onclick = ()=>{ subsOn=!subsOn; st.setAttribute('aria-pressed',String(subsOn)); const s=sub(); if(s) s.hidden=!subsOn; };
const sel=document.getElementById('voiceSel');
sel.addEventListener('change',()=>{
  const old=TL[mode].tl, k=Math.max(0,next-1), frac = old[k] ? (now()-old[k][0]) : 0;
  mode=sel.value; const was=playing; audio.pause(); audioOk=true;
  audio.src=`audio/narracao-${mode}.mp3`;
  const t = TL[mode].tl[k] ? TL[mode].tl[k][0]+Math.max(0,frac) : 0;
  audio.addEventListener('loadedmetadata',()=>{ try{ audio.currentTime=t; }catch(e){} if(was){ audio.muted=!voiceOn; audio.play().catch(()=>{}); } },{once:true});
  vt0=clock-t*1000;
});
document.getElementById('fsBtn').onclick = ()=>{ try{ const p=screen.requestFullscreen?.(); p&&p.catch(()=>{}); }catch(e){} };
document.addEventListener('keydown',e=>{ if(e.code==='Space' && e.target===document.body){ e.preventDefault(); playing?pause():play(); } });
})();
</script>

</body></html>
